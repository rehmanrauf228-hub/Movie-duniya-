name: Deploy Movie Duniya to GitHub Pages

on:
  # Trigger the workflow on push to main branch
  push:
    branches:
      - main
      - master
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# NOTE: cancel-in-progress is set to false to prevent aborting active deployments which causes deployment_queued lockups.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Production Web App for GitHub Pages
        run: npm run build
        env:
          VITE_BASE: '/Movie-duniya/'

      - name: Verify dist folder
        run: |
          ls -la dist/
          test -f dist/index.html || (echo "dist/index.html is missing!" && exit 1)
          test -f dist/404.html || (echo "dist/404.html is missing!" && exit 1)

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
